<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Reflection Studio</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #faf5ff;
      color: #7c3aed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
    }
    p {
      color: #4c1d95;
      max-width: 400px;
      line-height: 1.5;
    }
    a {
      margin-top: 20px;
      display: inline-block;
      padding: 10px 20px;
      background-color: #7c3aed;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
    }
    a:hover {
      background-color: #6d28d9;
    }
  </style>
</head>
<body>
  <h1>You are offline</h1>
  <p>Don't worry! All your journal entries and templates are stored locally and are fully available offline. You can continue writing and viewing your past reflections.</p>
  <a href="/">Go to Dashboard</a>
</body>
</html>
